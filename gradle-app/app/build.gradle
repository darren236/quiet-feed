apply plugin: 'com.android.application'

def signingFile = file('../../build/signing.properties')
if (!signingFile.isFile()) {
    throw new GradleException('Missing build/signing.properties. Run ./build.sh to prepare local signing.')
}
def signingProperties = new Properties()
signingFile.withInputStream { signingProperties.load(it) }
def signingPassword = signingProperties.getProperty('password')
if (!signingPassword || !(signingPassword ==~ /[A-Za-z0-9]+/)) {
    throw new GradleException('build/signing.properties must contain an alphanumeric password value.')
}

android {
    namespace 'com.darren.quietfeed'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darren.quietfeed'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '1.6'
    }

    sourceSets {
        main {
            manifest.srcFile '../../AndroidManifest.xml'
            java.srcDirs = ['../../src']
            res.srcDirs = ['../../res']
        }
    }

    signingConfigs {
        quietfeed {
            storeFile file('../../build/quietfeed.keystore')
            storePassword signingPassword
            keyAlias 'quietfeed'
            keyPassword signingPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.quietfeed
        }
    }
}
