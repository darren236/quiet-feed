apply plugin: 'com.android.application'

def signingFile = file('../../build/signing.properties')
def signingProperties = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { signingProperties.load(it) }
def signingPassword = signingProperties.getProperty('password')
def hasReleaseSigning = signingPassword && signingPassword ==~ /[A-Za-z0-9]+/ &&
        file('../../build/quietfeed.keystore').isFile()

android {
    namespace 'com.darren.quietfeed'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darren.quietfeed'
        minSdk 23
        targetSdk 36
        versionCode 13
        versionName '1.12'
    }

    sourceSets {
        main {
            manifest.srcFile '../../AndroidManifest.xml'
            java.srcDirs = ['../../src']
            res.srcDirs = ['../../res']
        }
    }

    signingConfigs {
        if (hasReleaseSigning) quietfeed {
            storeFile file('../../build/quietfeed.keystore')
            storePassword signingPassword
            keyAlias 'quietfeed'
            keyPassword signingPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.quietfeed
        }
    }
}

// These rules are plain Java, so contributors can run them without an emulator or JUnit.
def ruleClasses = layout.buildDirectory.dir('screen-rule-tests')
def compileRules = tasks.register('compileScreenRuleTests', JavaCompile) {
    source = files('../../src/com/darren/quietfeed/ScreenRules.java',
            '../../src/com/darren/quietfeed/ChatVideoOrigin.java',
            '../../src/com/darren/quietfeed/SharedReelComments.java',
            '../../tests/com/darren/quietfeed/ScreenRulesTest.java')
    classpath = files()
    destinationDirectory = ruleClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
def ruleTests = tasks.register('screenRulesTest', JavaExec) {
    dependsOn compileRules
    classpath = files(ruleClasses)
    mainClass = 'com.darren.quietfeed.ScreenRulesTest'
}
tasks.matching { it.name in ['check', 'preReleaseBuild', 'testDebugUnitTest', 'testReleaseUnitTest'] }
        .configureEach { dependsOn ruleTests }
